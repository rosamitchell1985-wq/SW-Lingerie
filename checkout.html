<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout — SW Lingerie | swlingerie.shop</title>
<meta name="description" content="Secure checkout. We accept Visa, Mastercard, American Express, Discover, PayPal and Apple Pay.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%232a160d'/><text x='50' y='66' font-size='46' text-anchor='middle' fill='%23fcfcf8' font-family='Georgia'>SW</text></svg>">
</head>
<body>
<div id="site-header" data-page=""></div>

<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <h1>Secure Checkout</h1>
      <p class="sub">Three short steps and you're done. Prefer to order by phone? Call <a href="tel:+18005550142" style="font-weight:700">1-800-555-0142</a>.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap" id="checkout-root"></div>
  </section>
</main>

<div class="processing-overlay" id="processing" role="alert" aria-live="assertive">
  <div class="processing-card">
    <div class="spinner" aria-hidden="true"></div>
    <h2 id="proc-title">Processing your payment…</h2>
    <p id="proc-sub">Please don't close this window.</p>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  const cart = getCart();
  const root = document.getElementById("checkout-root");

  if (!cart.length) {
    root.innerHTML = `<div class="empty-cart"><h2>Your cart is empty</h2><p>Add something lovely before checking out.</p><a class="btn btn-primary btn-lg" href="shop.html">Browse the Collection</a></div>`;
    return;
  }

  const subtotal = cartSubtotal();
  const shipping = cartShipping(subtotal);

  const STATES = ["","Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming","District of Columbia"];

  const lines = cart.map(item => {
    const p = getProduct(item.id);
    return `<div class="order-line">
      <img src="${p.image}" alt="">
      <div><div class="ol-name">${p.name}</div><div class="ol-meta">Size ${item.size} · Qty ${item.qty}</div></div>
      <span class="ol-price">${formatUSD(p.price * item.qty)}</span>
    </div>`;
  }).join("");

  root.innerHTML = `
  <div class="checkout-layout">
    <form id="checkout-form" novalidate>
      <!-- Step 1: Contact & Shipping -->
      <div class="checkout-step">
        <div class="step-head"><span class="step-num">1</span><h2>Contact & Shipping Address</h2></div>
        <div class="form-grid">
          <div class="field"><label for="f-first">First name <span class="req">*</span></label><input id="f-first" autocomplete="given-name"><div class="error-text">Please enter your first name.</div></div>
          <div class="field"><label for="f-last">Last name <span class="req">*</span></label><input id="f-last" autocomplete="family-name"><div class="error-text">Please enter your last name.</div></div>
          <div class="field full"><label for="f-email">Email address <span class="req">*</span></label><input id="f-email" type="email" autocomplete="email" placeholder="you@example.com"><div class="hint">We'll send your order confirmation and tracking here.</div><div class="error-text">Please enter a valid email address.</div></div>
          <div class="field full"><label for="f-phone">Phone number <span class="req">*</span></label><input id="f-phone" type="tel" autocomplete="tel" placeholder="(555) 123-4567"><div class="error-text">Please enter a valid 10-digit U.S. phone number.</div></div>
          <div class="field full"><label for="f-addr">Street address <span class="req">*</span></label><input id="f-addr" autocomplete="street-address" placeholder="123 Main Street, Apt 4"><div class="error-text">Please enter your street address.</div></div>
          <div class="field"><label for="f-city">City <span class="req">*</span></label><input id="f-city" autocomplete="address-level2"><div class="error-text">Please enter your city.</div></div>
          <div class="field"><label for="f-state">State <span class="req">*</span></label>
            <select id="f-state" autocomplete="address-level1">${STATES.map(s => `<option value="${s}">${s || "Select your state"}</option>`).join("")}</select>
            <div class="error-text">Please select your state.</div></div>
          <div class="field"><label for="f-zip">ZIP code <span class="req">*</span></label><input id="f-zip" inputmode="numeric" autocomplete="postal-code" placeholder="97201" maxlength="10"><div class="error-text">Please enter a valid 5-digit ZIP code.</div></div>
        </div>
      </div>

      <!-- Step 2: Payment -->
      <div class="checkout-step">
        <div class="step-head"><span class="step-num">2</span><h2>Payment Method</h2></div>
        <div class="pay-methods" role="radiogroup" aria-label="Payment method">
          <label class="pay-method selected">
            <input type="radio" name="paymethod" value="card" checked>
            <span><span class="pm-name">Credit or Debit Card</span><br><span class="pm-desc">Visa, Mastercard, American Express, Discover</span></span>
            <span class="pay-logos" aria-hidden="true">
              <svg height="30" viewBox="0 0 48 30"><rect width="48" height="30" rx="4" fill="#1a1f71"/><text x="24" y="20" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold" font-style="italic" font-family="Arial">VISA</text></svg>
              <svg height="30" viewBox="0 0 48 30"><rect width="48" height="30" rx="4" fill="#f4f1e8"/><circle cx="19" cy="15" r="9" fill="#eb001b"/><circle cx="29" cy="15" r="9" fill="#f79e1b" fill-opacity=".85"/></svg>
              <svg height="30" viewBox="0 0 48 30"><rect width="48" height="30" rx="4" fill="#2e77bc"/><text x="24" y="19" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold" font-family="Arial">AMEX</text></svg>
              <svg height="30" viewBox="0 0 48 30"><rect width="48" height="30" rx="4" fill="#fff" stroke="#ddd"/><text x="24" y="19" text-anchor="middle" fill="#f48120" font-size="7.5" font-weight="bold" font-family="Arial">DISCOVER</text></svg>
            </span>
          </label>
          <label class="pay-method">
            <input type="radio" name="paymethod" value="paypal">
            <span><span class="pm-name">PayPal</span><br><span class="pm-desc">Pay with your PayPal balance or linked bank account</span></span>
            <span class="pay-logos" aria-hidden="true">
              <svg height="30" viewBox="0 0 90 30"><text x="0" y="21" font-size="16" font-weight="bold" font-style="italic" font-family="Arial" fill="#003087">Pay</text><text x="32" y="21" font-size="16" font-weight="bold" font-style="italic" font-family="Arial" fill="#0079c1">Pal</text></svg>
            </span>
          </label>
          <label class="pay-method">
            <input type="radio" name="paymethod" value="applepay">
            <span><span class="pm-name">Apple Pay</span><br><span class="pm-desc">Fast, secure payment from your Apple device</span></span>
            <span class="pay-logos" aria-hidden="true">
              <svg height="30" viewBox="0 0 80 30"><text x="0" y="20" font-size="15" font-weight="600" font-family="Arial" fill="#000">&#63743; Pay</text></svg>
            </span>
          </label>
        </div>

        <div class="card-panel" id="card-panel">
          <div class="form-grid">
            <div class="field full"><label for="c-name">Name on card <span class="req">*</span></label><input id="c-name" autocomplete="cc-name"><div class="error-text">Please enter the name on your card.</div></div>
            <div class="field full"><label for="c-num">Card number <span class="req">*</span></label><input id="c-num" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="19"><div class="error-text">Please enter a valid card number.</div></div>
            <div class="field"><label for="c-exp">Expiry (MM/YY) <span class="req">*</span></label><input id="c-exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5"><div class="error-text">Enter a valid future date as MM/YY.</div></div>
            <div class="field"><label for="c-cvv">Security code (CVV) <span class="req">*</span></label><input id="c-cvv" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4"><div class="hint">3 digits on the back (4 on front for Amex).</div><div class="error-text">Enter the 3–4 digit security code.</div></div>
          </div>
        </div>
        <div class="card-panel" id="paypal-panel" hidden>
          <p style="font-size:1.1rem;margin-bottom:8px"><strong>You'll confirm this order with PayPal.</strong></p>
          <p style="color:var(--ink-soft)">Click "Place Order" below and we'll open a secure PayPal window to complete your payment. Nothing is charged until you approve it there.</p>
        </div>
        <div class="card-panel" id="applepay-panel" hidden>
          <p style="font-size:1.1rem;margin-bottom:8px"><strong>You'll confirm this order with Apple Pay.</strong></p>
          <p style="color:var(--ink-soft)">Click "Place Order" below and confirm with Face ID, Touch ID, or your device passcode. Nothing is charged until you approve.</p>
        </div>
        <p class="secure-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          256-bit SSL encrypted. We never store your full card number.
        </p>
      </div>

      <!-- Step 3: Review -->
      <div class="checkout-step">
        <div class="step-head"><span class="step-num">3</span><h2>Review & Place Order</h2></div>
        <div class="order-lines">${lines}</div>
        <button type="submit" class="btn btn-accent btn-lg btn-block" id="place-order" style="margin-top:26px">Place Order — <span id="btn-total"></span></button>
        <p style="text-align:center;color:var(--ink-mute);font-size:0.98rem;margin-top:14px">
          By placing your order you agree to our <a href="terms-of-service.html">Terms of Service</a> and <a href="privacy-policy.html">Privacy Policy</a>.
        </p>
      </div>
    </form>

    <aside class="summary-card" aria-label="Order summary">
      <h2>Order Summary</h2>
      <div class="summary-row"><span>Subtotal</span><span>${formatUSD(subtotal)}</span></div>
      <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? "FREE" : formatUSD(shipping)}</span></div>
      <div class="summary-row"><span>Estimated tax</span><span id="tax-cell">Calculated after ZIP</span></div>
      <div class="summary-row total"><span>Total</span><span id="total-cell"></span></div>
      <p class="summary-note">90-day free returns · Discreet packaging · Ships from Portland, OR within 1–2 business days.</p>
      <p class="secure-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7 12 12 0 0 0 .7 2.8 2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.45 12 12 0 0 0 2.8.7 2 2 0 0 1 1.7 2.05z"/></svg>
        Rather order by phone? Call <strong>1-800-555-0142</strong>
      </p>
    </aside>
  </div>`;

  /* ----- totals with estimated tax by ZIP (simple flat 6% estimate once ZIP valid) ----- */
  let tax = 0;
  function total() { return subtotal + shipping + tax; }
  function paintTotals() {
    document.getElementById("total-cell").textContent = formatUSD(total());
    document.getElementById("btn-total").textContent = formatUSD(total());
    document.getElementById("tax-cell").textContent = tax > 0 ? formatUSD(tax) : "Calculated after ZIP";
  }
  paintTotals();

  const zipInput = document.getElementById("f-zip");
  zipInput.addEventListener("input", () => {
    const z = zipInput.value.trim();
    if (/^\d{5}(-\d{4})?$/.test(z)) {
      tax = Math.round(subtotal * 0.06 * 100) / 100;
    } else {
      tax = 0;
    }
    paintTotals();
  });

  /* ----- payment method switching ----- */
  const panels = { card: "card-panel", paypal: "paypal-panel", applepay: "applepay-panel" };
  document.querySelectorAll('input[name="paymethod"]').forEach(r => {
    r.addEventListener("change", () => {
      document.querySelectorAll(".pay-method").forEach(m => m.classList.remove("selected"));
      r.closest(".pay-method").classList.add("selected");
      Object.entries(panels).forEach(([k, id]) => {
        document.getElementById(id).hidden = (k !== r.value);
      });
    });
  });

  /* ----- card input formatting ----- */
  const numInput = document.getElementById("c-num");
  numInput.addEventListener("input", () => {
    numInput.value = numInput.value.replace(/\D/g, "").slice(0, 16).replace(/(\d{4})(?=\d)/g, "$1 ");
  });
  const expInput = document.getElementById("c-exp");
  expInput.addEventListener("input", () => {
    let v = expInput.value.replace(/\D/g, "").slice(0, 4);
    if (v.length >= 3) v = v.slice(0, 2) + "/" + v.slice(2);
    expInput.value = v;
  });
  const cvvInput = document.getElementById("c-cvv");
  cvvInput.addEventListener("input", () => { cvvInput.value = cvvInput.value.replace(/\D/g, "").slice(0, 4); });

  function luhn(num) {
    const d = num.replace(/\s/g, "");
    if (d.length < 13 || d.length > 19) return false;
    let sum = 0, alt = false;
    for (let i = d.length - 1; i >= 0; i--) {
      let n = parseInt(d[i], 10);
      if (alt) { n *= 2; if (n > 9) n -= 9; }
      sum += n; alt = !alt;
    }
    return sum % 10 === 0;
  }

  /* ----- validation ----- */
  function setValid(input, ok) {
    input.closest(".field").classList.toggle("invalid", !ok);
    return ok;
  }
  function validateShipping() {
    let ok = true;
    ok = setValid(document.getElementById("f-first"), document.getElementById("f-first").value.trim().length >= 2) && ok;
    ok = setValid(document.getElementById("f-last"), document.getElementById("f-last").value.trim().length >= 2) && ok;
    ok = setValid(document.getElementById("f-email"), /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(document.getElementById("f-email").value.trim())) && ok;
    ok = setValid(document.getElementById("f-phone"), document.getElementById("f-phone").value.replace(/\D/g, "").length >= 10) && ok;
    ok = setValid(document.getElementById("f-addr"), document.getElementById("f-addr").value.trim().length >= 5) && ok;
    ok = setValid(document.getElementById("f-city"), document.getElementById("f-city").value.trim().length >= 2) && ok;
    ok = setValid(document.getElementById("f-state"), document.getElementById("f-state").value !== "") && ok;
    ok = setValid(zipInput, /^\d{5}(-\d{4})?$/.test(zipInput.value.trim())) && ok;
    return ok;
  }
  function validateCard() {
    let ok = true;
    ok = setValid(document.getElementById("c-name"), document.getElementById("c-name").value.trim().length >= 3) && ok;
    ok = setValid(numInput, luhn(numInput.value)) && ok;
    const exp = expInput.value;
    let expOk = false;
    const m = exp.match(/^(\d{2})\/(\d{2})$/);
    if (m) {
      const mm = parseInt(m[1], 10), yy = 2000 + parseInt(m[2], 10);
      const now = new Date();
      expOk = mm >= 1 && mm <= 12 && (yy > now.getFullYear() || (yy === now.getFullYear() && mm >= now.getMonth() + 1));
    }
    ok = setValid(expInput, expOk) && ok;
    ok = setValid(cvvInput, /^\d{3,4}$/.test(cvvInput.value)) && ok;
    return ok;
  }

  /* ----- place order ----- */
  document.getElementById("checkout-form").addEventListener("submit", function (e) {
    e.preventDefault();
    const method = document.querySelector('input[name="paymethod"]:checked').value;
    const shipOk = validateShipping();
    const cardOk = method === "card" ? validateCard() : true;
    if (!shipOk || !cardOk) {
      const firstBad = document.querySelector(".field.invalid input, .field.invalid select");
      if (firstBad) { firstBad.scrollIntoView({ behavior: "smooth", block: "center" }); firstBad.focus({ preventScroll: true }); }
      showToast("Please review the highlighted fields above.");
      return;
    }

    const overlay = document.getElementById("processing");
    const title = document.getElementById("proc-title");
    const sub = document.getElementById("proc-sub");
    overlay.classList.add("show");

    if (method === "card") {
      title.textContent = "Processing your card payment…";
      sub.textContent = "Contacting your bank securely. Please don't close this window.";
    } else if (method === "paypal") {
      title.textContent = "Connecting to PayPal…";
      sub.textContent = "Confirming your payment with PayPal. Please don't close this window.";
    } else {
      title.textContent = "Waiting for Apple Pay…";
      sub.textContent = "Confirm with Face ID, Touch ID, or your passcode.";
    }

    setTimeout(() => {
      title.textContent = "Confirming your order…";
      sub.textContent = "Almost done — reserving your items.";
    }, 1800);

    setTimeout(() => {
      const orderNum = "SWL-" + new Date().getFullYear() + "-" + String(Math.floor(100000 + Math.random() * 900000));
      const order = {
        number: orderNum,
        date: new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }),
        email: document.getElementById("f-email").value.trim(),
        name: document.getElementById("f-first").value.trim() + " " + document.getElementById("f-last").value.trim(),
        address: document.getElementById("f-addr").value.trim() + ", " + document.getElementById("f-city").value.trim() + ", " + document.getElementById("f-state").value + " " + zipInput.value.trim(),
        method: method === "card" ? "Card ending in " + numInput.value.replace(/\s/g, "").slice(-4) : (method === "paypal" ? "PayPal" : "Apple Pay"),
        items: getCart().map(i => { const p = getProduct(i.id); return { name: p.name, size: i.size, qty: i.qty, price: p.price, image: p.image }; }),
        subtotal: subtotal, shipping: shipping, tax: tax, total: total()
      };
      localStorage.setItem("swl_last_order", JSON.stringify(order));
      const orders = JSON.parse(localStorage.getItem("swl_orders") || "[]");
      orders.push(order);
      localStorage.setItem("swl_orders", JSON.stringify(orders));
      clearCart();
      location.href = "confirmation.html";
    }, 3600);
  });
})();
</script>
</body>
</html>
