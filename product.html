<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — SW Lingerie | swlingerie.shop</title>
<meta name="description" content="Comfort-first intimate apparel for women over sixty.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%232a160d'/><text x='50' y='66' font-size='46' text-anchor='middle' fill='%23fcfcf8' font-family='Georgia'>SW</text></svg>">
</head>
<body>
<div id="site-header" data-page="shop"></div>

<main id="main">
  <section class="section">
    <div class="wrap">
      <nav aria-label="Breadcrumb" style="margin-bottom:34px;font-size:1rem">
        <a href="index.html">Home</a> &nbsp;›&nbsp; <a href="shop.html">Shop</a> &nbsp;›&nbsp; <span id="crumb-name" aria-current="page" style="color:var(--ink-mute)"></span>
      </nav>
      <div id="pd-root"></div>
    </div>
  </section>

  <section class="section section-alt">
    <div class="wrap">
      <div class="split-heading">
        <span class="sh-left">You May Also Love</span>
        <span class="sh-right">Pairs beautifully</span>
      </div>
      <div class="product-grid" id="related-grid"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  const id = new URLSearchParams(location.search).get("id") || 1;
  const p = getProduct(id);
  const root = document.getElementById("pd-root");
  if (!p) {
    root.innerHTML = `<div class="empty-cart"><h2>Product not found</h2><p>The item you're looking for isn't available.</p><a class="btn btn-primary" href="shop.html">Back to Shop</a></div>`;
    return;
  }
  document.title = p.name + " — SW Lingerie | swlingerie.shop";
  document.getElementById("crumb-name").textContent = p.name;

  root.innerHTML = `
  <div class="pd-layout">
    <div class="pd-image">
      <img src="${p.image}" alt="${p.name}">
    </div>
    <div class="pd-info">
      <span class="pd-cat">${p.category}</span>
      <h1>${p.name}</h1>
      <div class="p-rating" aria-label="Rated ${p.rating} out of 5 stars">${starsHTML(p.rating)} <span class="count">${p.rating} · ${p.reviews} reviews</span></div>
      <p class="pd-price">${formatUSD(p.price)}${p.compareAt ? `<span class="compare">${formatUSD(p.compareAt)}</span>` : ""}</p>
      <p class="pd-desc">${p.desc}</p>
      <ul class="pd-features">
        ${p.features.map(f => `<li>${f}</li>`).join("")}
      </ul>
      <span class="option-label" id="size-label">Choose your size:</span>
      <div class="size-row" role="radiogroup" aria-labelledby="size-label">
        ${p.sizes.map((s, i) => `<button type="button" class="size-btn" role="radio" aria-checked="false" data-size="${s}">${s}</button>`).join("")}
      </div>
      <p id="size-error" style="color:var(--error);font-weight:600;margin-top:8px;display:none">Please choose a size first.</p>
      <div class="qty-row">
        <span class="option-label" style="margin:0">Quantity:</span>
        <div class="qty-control">
          <button type="button" id="qty-minus" aria-label="Decrease quantity">−</button>
          <input id="qty-input" type="text" inputmode="numeric" value="1" aria-label="Quantity">
          <button type="button" id="qty-plus" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <div style="margin-top:30px">
        <button class="btn btn-primary btn-lg btn-block" id="add-btn">Add to Cart — ${formatUSD(p.price)}</button>
      </div>
      <div class="assurance-row">
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l9-5 9 5v8l-9 5-9-5V8z"/></svg>Free shipping over $75</div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>90-day free returns</div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7 12 12 0 0 0 .7 2.8 2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.45 12 12 0 0 0 2.8.7 2 2 0 0 1 1.7 2.05z"/></svg>Order by phone: 1-800-555-0142</div>
      </div>
    </div>
  </div>`;

  let selectedSize = null;
  const sizeErr = document.getElementById("size-error");
  document.querySelectorAll(".size-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".size-btn").forEach(b => { b.classList.remove("selected"); b.setAttribute("aria-checked", "false"); });
      btn.classList.add("selected");
      btn.setAttribute("aria-checked", "true");
      selectedSize = btn.dataset.size;
      sizeErr.style.display = "none";
    });
  });

  const qtyInput = document.getElementById("qty-input");
  document.getElementById("qty-minus").addEventListener("click", () => { qtyInput.value = Math.max(1, (parseInt(qtyInput.value) || 1) - 1); });
  document.getElementById("qty-plus").addEventListener("click", () => { qtyInput.value = Math.min(10, (parseInt(qtyInput.value) || 1) + 1); });
  qtyInput.addEventListener("change", () => { qtyInput.value = Math.max(1, Math.min(10, parseInt(qtyInput.value) || 1)); });

  document.getElementById("add-btn").addEventListener("click", () => {
    if (!selectedSize) {
      sizeErr.style.display = "block";
      document.getElementById("size-label").scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    addToCart(p.id, selectedSize, parseInt(qtyInput.value) || 1);
    showToast(`<strong>${p.name}</strong> (size ${selectedSize}) added to your cart.`, true);
  });

  // Related products (same category first, then others)
  const related = PRODUCTS.filter(x => x.id !== p.id)
    .sort((a, b) => (b.category === p.category) - (a.category === p.category))
    .slice(0, 3);
  document.getElementById("related-grid").innerHTML = related.map(r => `
    <a class="product-card reveal" href="product.html?id=${r.id}">
      <div class="p-img"><img src="${r.image}" alt="${r.name}" loading="lazy"></div>
      <div class="p-info">
        <div class="p-rating">${starsHTML(r.rating)} <span class="count">(${r.reviews})</span></div>
        <h3>${r.name}</h3>
        <p class="p-price">${formatUSD(r.price)}</p>
      </div>
    </a>`).join("");
})();
</script>
</body>
</html>
