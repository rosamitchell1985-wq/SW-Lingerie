<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help & FAQ — SW Lingerie | swlingerie.shop</title>
<meta name="description" content="Answers about sizing, ordering, payment, shipping and returns at SW Lingerie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%232a160d'/><text x='50' y='66' font-size='46' text-anchor='middle' fill='%23fcfcf8' font-family='Georgia'>SW</text></svg>">
</head>
<body>
<div id="site-header" data-page="faq"></div>

<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <h1>Help & Frequently Asked Questions</h1>
      <p class="sub">Tap any question to see the answer. Still stuck? Call <a href="tel:+18005550142" style="font-weight:700">1-800-555-0142</a> — a real person will help.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap-narrow" id="faq-list"></div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
const FAQS = [
  ["How do I find my correct bra size?",
   "Our bras are sized generously and most customers wear their usual size. Measure around your ribcage just under the bust for the band number, then around the fullest part of your bust — each inch of difference is one cup letter (1\"=A, 2\"=B, and so on). Still unsure? Call us at 1-800-555-0142 and a fit specialist will walk you through it in a few minutes. You can also visit our Size Guide page."],
  ["I have arthritis in my hands. Which bra is easiest to put on?",
   "We recommend the Everyday Ease Front-Closure Bra or the Rose Dawn Front-Clasp Leisure Bra. Both close at the front with large, easy-grip clasps — no reaching behind your back and no tiny hooks. They're our two most popular styles among customers with arthritis and limited shoulder mobility."],
  ["Are your bras really wire-free?",
   "Yes — every bra we sell is completely wire-free. We use wide underbands, full-coverage cups, and supportive fabric panels instead of underwire, so nothing pokes, pinches, or presses on sensitive areas."],
  ["What payment methods do you accept?",
   "We accept Visa, Mastercard, American Express, Discover, PayPal, and Apple Pay. All prices are in U.S. dollars, and every payment is processed over a secure, encrypted connection. You can also order by phone at 1-800-555-0142 if you prefer."],
  ["Is the packaging discreet?",
   "Always. Your order ships in a plain, unbranded box or mailer with a return address that reads simply \"SWL.\" Nothing on the outside reveals what's inside."],
  ["How long does shipping take?",
   "Orders leave our Portland, Oregon studio within 1–2 business days and arrive in 3–5 business days for most U.S. addresses (7–10 days for Alaska, Hawaii, and territories). Shipping is free over $75, or a flat $6.95 below that."],
  ["What is your return policy?",
   "You have 90 days from delivery. Returns and exchanges are free — we'll email you a prepaid label, and if you don't have a printer we'll mail you one. Refunds go back to your original payment method within 5 business days of our receiving your return."],
  ["How do I care for my garments?",
   "Most of our cotton and knit pieces are machine washable on a gentle cycle — tumble dry low. Silk-blend pieces do best with hand washing or a delicate cycle in a mesh bag. Every item's care label has simple, large-print instructions."],
  ["Can I order by phone instead of online?",
   "Absolutely — about a third of our customers do. Call 1-800-555-0142, Monday through Saturday, 8am–8pm Eastern. We'll take your order, answer fit questions, and even help you decide between styles."],
  ["Do you offer gift wrapping?",
   "Yes. Mention it at checkout by phone, or add a note with your online order, and we'll wrap your items in cream tissue with a ribbon at no charge. A handwritten gift message is always free."]
];
document.getElementById("faq-list").innerHTML = FAQS.map((f, i) => `
  <div class="faq-item">
    <button class="faq-q" aria-expanded="false" aria-controls="faq-a-${i}">${f[0]}</button>
    <div class="faq-a" id="faq-a-${i}" hidden>${f[1]}</div>
  </div>`).join("");
</script>
</body>
</html>
